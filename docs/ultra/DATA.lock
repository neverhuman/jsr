### MUSAN noise and music (OpenSLR 17, CC BY 4.0), recorded 2026-11-24
- **Source:** https://www.openslr.org/17/. D. Snyder, G. Chen, D. Povey, "MUSAN: A Music, Speech, and Noise Corpus", 2015.
- **Use:** the `music` and `noise` parts only, for additive-noise augmentation. The `speech` part is excluded because it includes LibriVox recordings.
- **Staged set:** `cut10s`, 17,556 10-second WAVs, 48.264 h, `SHA256SUMS` `423c77beddfaf5efbfb69f2526b8c9dd081969228c9d9950684b52a49e92d2e0`.

### Room impulse responses (OpenSLR 28, simulated subset, Apache 2.0), recorded 2026-11-24
- **Source:** https://www.openslr.org/28/, `rirs_noises.zip` sha256 `3b50cfde915b3984738169b4beb341e9f6b8062ae4c2076146c5db71c2c05dc7`. T. Ko, V. Peddinti, D. Povey, M. L. Seltzer, S. Khudanpur, "A study on data augmentation of reverberant speech for robust speech recognition", ICASSP 2017.
- **Use:** only the 60,000 `simulated_rirs`. The 325 `real_rirs` come from three other databases with their own terms and are excluded. The isotropic and point-source noises are also excluded.
- **Manifest** (real vs simulated tagged): `manifest.jsonl` sha256 `ab0a2e87cfea772c81d3f6327d06b8761132fbff13a7aebc7bb66146e004a7fc`.

### Multilingual LibriSpeech, English train (OpenSLR 94, CC BY 4.0), recorded 2026-11-24
- **Source:** Hugging Face `parler-tts/mls_eng` at `faf6604dcf0bb9ec0d9c280a140ad74da9c931b0`, train split only. Manifest `mls_eng_full_train.json` sha256 `876a5e736076c95105a42ecfd24d2cf270613fbe33d92fa1b0d510027e8b9c17`. V. Pratap, Q. Xu, A. Sriram, G. Synnaeve, R. Collobert, "MLS: A Large-Scale Multilingual Dataset for Speech Research", Interspeech 2020.
- **The audio is LibriVox**, like LibriSpeech and Libri-Light. So:
  - **Excluded:** every chapter whose speaker, LibriVox project, Gutenberg ID or normalised title collides with any LibriSpeech dev / test set, plus MLS's own dev / test books: 7,795 chapters, 1,677.03 h.
    - Audit `mls_overlap_verdict.json` sha256 `ee14e971a3a4b0c890c584a751271b230d9019f2e820f91615f74bcf398b6990`.
    - Allow-list `allowed_train_pairs.tsv` sha256 `0bdecf4250c9f346ce03c7713aa2f05ad1edb0b541547f54f4ac92646920192c` (172,810 chapters, 42,982.72 h).
  - **Before use, also dedupe** against the Libri-Light recordings already in training, by (speaker, LibriVox book), so the same audio isn't counted twice.
- **Labels:** PL3 relabelling. MLS's own transcripts are not used as training targets.

### People's Speech, `clean` CC-BY subset only (MLCommons), recorded 2026-11-24
- **Source:** Hugging Face `MLCommons/peoples_speech` at `f10597c5d3d3a63f8b6827701297c3afdf178272`, `clean` train config. 804 shards, 1,501,271 utterances. Manifest `peoples_speech_clean_ccby_train.json` sha256 `15303e2def0322645bc0a8706dedad8009341d8607213d581b60ef40d05be38d`.
- **Rights:** CC-BY 2.0 / 2.5 / 3.0 / 4.0 only, with attribution kept per utterance.
  - The `clean_sa` (ShareAlike) and `dirty` configs are **not** approved.
  - Its validation / test splits are excluded.
- **Overlap:** rows whose source id names LibriVox are dropped, which avoids LibriSpeech audio coming in through Internet Archive.
- **Use:** a separately registered arm only, after the audiobook data. Labels come from PL3 relabelling.

## Distribution of the v3 artifact (2026-11-23)
- **Cleared by the owner (2026-11-23)** as GitHub release files:
  - the v3 INT8 weights;
  - the `M5.ulm` LM pack;
  - the release decoder and the scorer.
  - They are attached to `v3.0.0` (unsigned) and `v3.0.1` (signed; [`releases/pinned.json`](releases/pinned.json)).
- **Attribution in the release notes:** LibriSpeech (CC BY 4.0): V. Panayotov, G. Chen, D. Povey, S. Khudanpur, "LibriSpeech: an ASR corpus based on public domain audio books", ICASSP 2015.
