## OOD dependence clusters (metadata only, from utterance ids; codex-review E1), 2026-11-20
- **Purpose:** used by the paired cluster bootstrap. Utterances are never treated as independent.
- **Generator:** `ultra.ood.cluster_of` / `cluster_map`. Verified caches only.

| Set | Rule | Utterances | Clusters | File | sha256 |
