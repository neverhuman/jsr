## LibriSpeech (CC BY 4.0), HF mirror openslr/librispeech_asr @ main (2026-11-20)
- **Source:** the same audio and transcripts as OpenSLR SLR12. OpenSLR served this host at under 1 MB/s, hence the mirror (DECISIONS 2026-11-20).
- **Parquet shards:** `/mnt/xbabe3-external/jsr/corpora/librispeech/hf_parquet/all/{train.clean.100,train.clean.360,train.other.500,validation.clean,validation.other,test.clean,test.other}`.
