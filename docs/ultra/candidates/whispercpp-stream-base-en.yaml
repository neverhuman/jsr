# Whisper.cpp Streaming Base: OpenAI Whisper base.en (ggml) through pywhispercpp 1.4.1 (whisper.cpp 1.8.2), CPU only,
# in the "streaming" configuration of the Picovoice speech-to-text benchmark: consecutive,
# non-overlapping 3 s chunks, each decoded on its own.
# Open-source comparator of paper v2. Schema: spec v1.0-B §11.2 (ultra.candidate.v1).
# Approval: owner ruling O16 (internal evaluation, DEV audio only, hash-locked, exploratory).
# Every field is resolved from the files run on xbabe0 on 2026-11-22 (bench-open).
# Receipts: docs/paper/data/raw/opponents/whispercpp-stream-base*/. Runner: docs/paper/opponents/whispercpp_stream.py.
