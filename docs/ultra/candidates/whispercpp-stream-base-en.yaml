stream:
  requested_chunk_ms: 3000
  actual_right_context_ms: 0  # no look-ahead beyond the chunk; a word waits for the end of its 3 s chunk
  left_context_policy: none_each_chunk_decoded_alone_in_a_30_s_padded_window
  revision_policy: chunk_text_final_when_emitted
  endpoint_policy_id: none.fixed_3s_chunks_final_at_eos
resources:
  intra_op_threads: 1
  inter_op_threads: 1
  affinity: pinned_one_physical_core_smt_sibling_idle
  eight_core_budget: >-
