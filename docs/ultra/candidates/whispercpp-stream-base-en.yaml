  backend: cpu
  quantization: fp16
  runtime_options: '{"audio_ctx":0,"backend":"cpu","blank_audio_removed":true,"chunk_ms":3000,"context_carried":false,"greedy_best_of":5,"language":"en","min_chunk_ms":200,"no_context":true,"packet_ms":20,"single_segment":true,"temperature_inc":0.2,"threads":1}'
  runtime_options_sha256: 6968523471fafb290919645cbf920f9896046ec93e3101e8b0d659eb7c89364c
  reference_configuration: >-
    Picovoice/speech-to-text-benchmark @ 272be8f2244c10dfb2994f192bd6390982b17a5d, engine.py, class WhisperCppStreamingEngine
    (WHISPER_CPP_STREAMING_BASE): WhisperCppModel("base.en", n_threads=1, single_segment=True,
    print_realtime=False, print_progress=False, redirect_whispercpp_logs_to=None); DEFAULT_CHUNK_SIZE_MS = 3000;
    a tail shorter than 0.2 s is zero-padded to 0.2 s; "[BLANK_AUDIO]" removed; chunk texts joined by spaces.
