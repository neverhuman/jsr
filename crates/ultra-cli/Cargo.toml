[package]
name = "ultra-cli"
description = "ULTRA command-line interface: inventory, candidate/bundle validation, streaming transcription, reference-blind benchmarking and comparison (spec v1.0-B §35)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ultra-core = { path = "../ultra-core" }
ultra-model = { path = "../ultra-model" }
ultra-frontend = { path = "../ultra-frontend" }
ultra-gp = { path = "../ultra-gp" }
ultra-engine = { path = "../ultra-engine" }
ultra-adapters = { path = "../ultra-adapters" }
ultra-stream = { path = "../ultra-stream" }
ultra-eval = { path = "../ultra-eval" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
libc = "0.2"
nix = { version = "0.29", default-features = false, features = ["resource"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[[bin]]
name = "ultra"
path = "src/main.rs"
