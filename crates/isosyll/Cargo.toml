[package]
name = "isosyll"
description = "isosyll: pure-Rust streaming speech recognition CLI (v4.0.0 release decoders, release flags baked in)"
version = "4.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ultra-engine = { path = "../ultra-engine", default-features = false }
ultra-frontend = { path = "../ultra-frontend" }
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[[bin]]
name = "isosyll"
path = "src/main.rs"
