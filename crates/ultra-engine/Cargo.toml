[package]
name = "ultra-engine"
description = "ULTRA pure-Rust fused CPU inference engine for the R1 streaming Conformer transducer (fp32 reference + per-row int8, AVX2/FMA)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ultra-core = { path = "../ultra-core" }
ultra-frontend = { path = "../ultra-frontend" }
ultra-gp = { path = "../ultra-gp" }
ultra-kernels = { path = "../ultra-kernels" }
ultra-eval = { path = "../ultra-eval", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
# Process CPU time on hosts without /proc (macOS) for the eval/density binaries.
nix = { version = "0.29", default-features = false, features = ["resource"] }

[features]
# WER scoring in ultra-engine-eval uses ultra-eval's normaliser/aligner (Linux-only crate).
# Build with --no-default-features on other hosts: transcripts and tokens are still written
# and are scored on a Linux host.
default = ["wer"]
wer = ["dep:ultra-eval"]

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

[[bin]]
name = "ultra-engine-eval"
path = "src/bin/engine_eval.rs"

[[bin]]
name = "ultra-engine-density"
path = "src/bin/engine_density.rs"

[[bin]]
name = "ultra-engine-prepare"
path = "src/bin/engine_prepare.rs"
