name: jankurai

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: bash ops/ci/fast.sh
      - run: bash ops/ci/contract-drift.sh
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "true"
      - run: bash ops/ci/install-security-tools.sh
      - run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - run: bash tools/security-lane.sh
      - run: bash ops/ci/sbom.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom
          path: target/sbom/
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install signed Jankurai 1.7.6
        shell: bash
        run: |
          installer="$RUNNER_TEMP/jankurai-installer.sh"
          curl --fail --silent --show-error --location \
            --proto "=https" --proto-redir "=https" --connect-timeout 15 --max-time 60 \
            --output "$installer" \
            https://github.com/neverhuman/jankurai-audit/releases/download/v1.7.6/jankurai-installer.sh
          printf "828e513628080823a9afaa19eeaeee4ce2e54174483a11cdde00073dbafb895f  %s\n" "$installer" | sha256sum --check --strict -
          bash "$installer" --repo neverhuman/jankurai-audit --tag v1.7.6 \
            --product jankurai --install-dir "$RUNNER_TEMP/jankurai-bin"
      - name: Run full audit and enforce score floor
        shell: bash
        run: |
          report="$RUNNER_TEMP/jankurai-report"
          mkdir -p "$report"
          "$RUNNER_TEMP/jankurai-bin/jankurai" audit . --full --mode standard \
            --fail-under 85 --no-badge --no-score-history \
            --json "$report/repo-score.json" --md "$report/repo-score.md" \
            --github-step-summary "$GITHUB_STEP_SUMMARY" \
            --repair-queue-jsonl "$report/repair-queue.jsonl"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jankurai-report
          if-no-files-found: ignore
          path: ${{ runner.temp }}/jankurai-report/
