minimum_score = 85
fail_on = ["critical", "high"]
advisory_on = ["medium", "low"]

[history]
max_rows = 500
max_bytes = 1048576
dedupe = "consecutive-equivalent"
mirror_env = "JANKURAI_HISTORY_MIRROR"
mirror_required = false
mirror_max_rows = 5000

[scan]
excluded_paths = ["tips/", ".agent/", ".claude/worktrees/",
  # Local signed-release installs are output, like the Cargo target tree.
  "models/",
  # As-ran experiment code kept verbatim inside research records (owner's rule: a wave folder holds the scripts
  # that ran). CI never imports or runs it; the records' documents and results stay in the scan.
  "research/H43_v3_baseline_and_measurement/records/bin/", "research/H45_zero_training_wins/bin/",
  "research/H49_sequence_training_and_kd/results/tools/", "research/H49_sequence_training_and_kd/results/bitexact/",
  "research/H49_sequence_training_and_kd/results/smoke/", "research/H50_fleet_training/scripts/",
  "research/H50_fleet_training/patches/", "research/H50_fleet_training/run_xb1_xb2/",
  "research/H51_engine_efficiency/pq/scripts/", "research/H51_engine_efficiency/pq/bench/",
  "research/H52_libri_light_semi_supervised/scripts/", "research/H53_v3_trunk_and_capacity/tools/",
  "research/H53_v3_trunk_and_capacity/tests/", "research/H53_v3_trunk_and_capacity/patches/",
  "research/H48_latency/scripts/", "research/H53_v3_trunk_and_capacity/s2_s3/tools/",
  "research/H53_v3_trunk_and_capacity/s2_s3/redacted/", "research/H52_libri_light_semi_supervised/labeller/"]

[smart_scan]
# After a clean full scan, only scan git-status changed files by default.
full_scan_interval_secs = 3600
roulette_rate = 0.10

# Full-repo `jankurai gate` stays advisory on new repos (never-freeze).
# The installed pre-commit hook still runs diff-audit vs HEAD and fails on
# hard findings or caps in touched files. That hook is not badge authority.
[precommit_gate]
blocking = false
