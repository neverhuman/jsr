# Generated and hand-maintained-but-checked zones.
#
# Event and receipt schemas are generated. The documents in
# crates/ultra-core/src/schemas/ are the source; `emit-schemas` writes
# contracts/events/. The Rust types remain what the runtime enforces, and
# `schema_contract` fails when a serialised value, a refusal, or a generated
# file disagrees (docs/generated-zones.md).

[[zone]]
path = "contracts/events/transcript-event.v1.schema.json"
source = "crates/ultra-core/src/schemas/transcript-event.v1.schema.json"
command = "cargo run -p ultra-core --bin emit-schemas --locked"
read_only = true
write_policy = "generated_output"

[[zone]]
path = "contracts/events/receipt.v1.schema.json"
source = "crates/ultra-core/src/schemas/receipt.v1.schema.json"
command = "cargo run -p ultra-core --bin emit-schemas --locked"
read_only = true
write_policy = "generated_output"

[[zone]]
path = "Cargo.lock"
source = "Cargo.toml"
command = "cargo metadata --locked --format-version 1"
read_only = false
write_policy = "lockfile"

[[zone]]
path = ".jankurai/score-history.jsonl"
source = "agent/audit-policy.toml"
command = "just score"
read_only = true
write_policy = "auditor_output"
