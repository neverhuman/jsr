# Boundary manifest for JSR. The jankurai scaffold assumed a web/API/DB stack;
# JSR is a Rust CPU speech recogniser plus a dated Python training exception,
# so only the boundaries that exist here are declared. See docs/boundaries.md.
[stack]
id = "rust-ts-vite-react-postgres-bounded-python"
version = "0.4.0"

[rust]
# ultra-core holds the numeric, event and receipt contracts. It must stay pure:
# no filesystem, environment, network, wall clock, randomness or logging.
domain_paths = ["crates/ultra-core/src"]
forbidden_domain_imports = [
  "std::fs",
  "std::env",
  "std::net",
  "std::time::SystemTime",
  "rand::",
  "reqwest::",
  "tracing::",
  "log::"
]

[python]
# python/ultra is the dated training/data exception (python/ultra/EXCEPTION.md,
# expires 2027-06-30). It produces model bundles and never ships, scores or
# gates a release, so it is non-product code.
allowed_truth_paths = ["python/ultra"]
allowed_non_product_paths = ["python/ultra"]
